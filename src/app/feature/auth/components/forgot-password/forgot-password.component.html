<header class="mb-8 text-center">
  <h1 class="text-headline-lg text-[var(--color-text-body)]">Forgot password?</h1>
  <p class="mt-1.5 text-body-md text-[var(--color-text-secondary)]">
    No worries, we'll send you reset instructions.
  </p>
</header>

<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  novalidate
  autocomplete="on"
  class="flex flex-col gap-1"
  aria-label="Forgot password form"
>
  <app-validation-field
    [fieldControl]="form.controls['email']"
    [label]="{ value: 'Email address', for: 'email' }"
    [validations]="[
      { name: 'required', msg: 'Email is required' },
      { name: 'email', msg: 'Enter a valid email address' },
    ]"
  >
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="Enter your email"
      class="form-input"
      [class.error]="form.controls['email'].invalid && form.controls['email'].touched"
    />
  </app-validation-field>

  @if (apiError()) {
    <div role="alert" aria-live="assertive" class="alert-error mt-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none"
           viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      {{ apiError() }}
    </div>
  }

  <button
    type="submit"
    [disabled]="form.invalid || remainingSeconds() > 0 || loading() "
    class="btn btn-primary mt-4"
    aria-label="Send reset link"
  >
    @if (loading()) {
      <span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"
            aria-hidden="true"></span>
      Sending…
    } @else {
      Send Reset Link
    }
  </button>
</form>

<footer class="mt-6 text-center">
  <a
    routerLink="/auth/login"
    class="inline-flex items-center gap-1.5 font-semibold text-[var(--color-primary)] transition-colors"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
         viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
    </svg>
    Back to log in
  </a>
</footer>

@if (submitted()) {
  <div class="mt-5 pt-5">
    <div class="alert-success font-semibold" role="status" aria-live="polite">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0"
           viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd"
              d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75
                 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53
                 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
              clip-rule="evenodd" />
      </svg>
      <span>If an account exists with this email, we've sent a password reset link.</span>
    </div>

    <div class="mt-5">
      <p class="text-center text-label-sm font-semibold text-[var(--color-text-secondary)] mb-3">
        Didn't receive the email?
      </p>

      <button
        type="button"
        (click)="onResend()"
        [disabled]="!canResend() || loading()"
        class="w-full flex items-center font-semibold justify-center gap-1 rounded-lg py-3
                text-[var(--color-text-secondary)]
               bg-[var(--color-surface-2)] transition-colors
               disabled:opacity-60 disabled:cursor-not-allowed"
        [attr.aria-label]="canResend() ? 'Resend reset email' : 'Resend available in ' + formattedTime()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
          <circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        @if (attemptsLeft() <= 0) {
          Maximum attempts reached
        } @else if (canResend()) {
          Resend
        } @else {
          Resend in {{ formattedTime() }}
        }
      </button>
    </div>
  </div>
}
