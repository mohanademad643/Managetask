<header class="mb-8 text-center">
  <h1 class="text-headline-lg text-[var(--color-text-body)]">Welcome Back</h1>
  <p class="mt-1.5 text-body-md text-[var(--color-text-secondary)]">
   Please enter your details to access your workspace
  </p>
</header>

<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  novalidate
  autocomplete="on"
  class="flex flex-col gap-1"
  aria-label="Sign in form"
>
  <app-validation-field
    [fieldControl]="form.controls['email']"
    [label]="{ value: 'Email', for: 'email' }"
    [validations]="[
      { name: 'required', msg: 'Email is required' },
      { name: 'email', msg: 'Enter a valid email address' },
    ]"
  >
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="Enter your email"
      class="form-input"
      [class.error]="
        form.controls['email'].invalid && form.controls['email'].touched
      "
    />
  </app-validation-field>

  <app-validation-field
    [fieldControl]="form.controls['password']"
    [label]="{ value: 'Password', for: 'password' }"
    [validations]="[{ name: 'required', msg: 'Password is required' }]"
  >
    <div class="input-password-wrap">
      <input
        id="password"
        [type]="showPwassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        class="form-input"
        [class.error]="
          form.controls['password'].invalid && form.controls['password'].touched
        "
      />
      <button
        type="button"
        (click)="showPwassword.set(!showPwassword())"
        [attr.aria-label]="showPwassword() ? 'Hide password' : 'Show password'"
        class="btn-eye"
      >
        @if (showPwassword()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0
                     1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162
                     10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65
                     3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242
                     4.242L9.88 9.88"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0
                     8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5
                     c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        }
      </button>
    </div>
  </app-validation-field>

  <div class="flex items-center justify-between mt-1 mb-5">
    <label
      class="flex items-center gap-2 cursor-pointer select-none text-body-md text-[var(--color-text-secondary)]"
    >
      <input
        type="checkbox"
        formControlName="rememberMe"
        class="w-4 h-4 rounded cursor-pointer accent-[var(--color-primary-container)]"
      />
      Remember Me
    </label>
    <a
      routerLink="/auth/forgot-password"
        class="ml-1 font-semibold transition-colors"
      style="color: var(--color-primary)"
    >
      Forgot Password?
    </a>
  </div>

  @if (apiError()) {
    <div role="alert" aria-live="assertive" class="alert-error">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4 shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>
      {{ apiError() }}
    </div>
  }

  <button
    type="submit"
    [disabled]="form.invalid || loading()"
    class="btn btn-primary"
    aria-label="Log in"
  >
    @if (loading()) {
      <span
        class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"
        aria-hidden="true"
      ></span>
      Signing in…
    } @else {
      Log In
    }
  </button>
</form>

<footer class="mt-6 pt-5 ">
  <p class="text-center text-body-md text-[var(--color-text-secondary)]">
    Don't have an account?
    <a
      routerLink="/auth/register"
      class="ml-1 font-semibold transition-colors"
      style="color: var(--color-primary)"
      >Sign Up</a
    >
  </p>
</footer>
