<div
  class="fixed inset-0 z-50 flex items-center justify-center p-[32px] bg-[#041B3C33] backdrop-blur-[4px]"
  tabindex="-1"
  (click)="close()"
  (keydown.escape)="close()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="epic() ? epic()!.title : 'Epic details'"
>
  <div
    class="w-full max-w-[672px] max-h-[921px] h-[90vh] overflow-y-auto bg-[var(--color-surface)] rounded-lg shadow-[0px_25px_50px_-12px_#00000040] p-6"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close()"
  >
    @if (loading()) {
      <app-skeleton-epic-detail></app-skeleton-epic-detail>
    } @else if (hasError() || !epic()) {
      <app-error-state
        description="Couldn't load this epic. Please try again."
        retryLabel="Close"
        (retry)="close()"
      ></app-error-state>
    } @else {
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-2">
          <svg
            width="20"
            height="14"
            viewBox="0 0 20 14"
            class="w-4 h-4 text-[var(--color-primary-container)]"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M0 10V4C0 3.45 0.195833 2.97917 0.5875 2.5875C0.979167 2.19583 1.45 2 2 2C2.55 2 3.02083 2.19583 3.4125 2.5875C3.80417 2.97917 4 3.45 4 4V10C4 10.55 3.80417 11.0208 3.4125 11.4125C3.02083 11.8042 2.55 12 2 12C1.45 12 0.979167 11.8042 0.5875 11.4125C0.195833 11.0208 0 10.55 0 10ZM7 14C6.45 14 5.97917 13.8042 5.5875 13.4125C5.19583 13.0208 5 12.55 5 12V2C5 1.45 5.19583 0.979167 5.5875 0.5875C5.97917 0.195833 6.45 0 7 0H13C13.55 0 14.0208 0.195833 14.4125 0.5875C14.8042 0.979167 15 1.45 15 2V12C15 12.55 14.8042 13.0208 14.4125 13.4125C14.0208 13.8042 13.55 14 13 14H7ZM16 10V4C16 3.45 16.1958 2.97917 16.5875 2.5875C16.9792 2.19583 17.45 2 18 2C18.55 2 19.0208 2.19583 19.4125 2.5875C19.8042 2.97917 20 3.45 20 4V10C20 10.55 19.8042 11.0208 19.4125 11.4125C19.0208 11.8042 18.55 12 18 12C17.45 12 16.9792 11.8042 16.5875 11.4125C16.1958 11.0208 16 10.55 16 10Z"
              fill="#003D9B"
            />
          </svg>

          <span class="text-label-sm text-[var(--color-text-secondary)]">{{
            epic()!.epic_id
          }}</span>
        </div>
        <button
          type="button"
          class="text-[var(--color-neutral-600)] hover:text-[var(--color-text-body)] cursor-pointer"
          (click)="close()"
          aria-label="Close"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18 18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <form [formGroup]="form">
        <!-- Title -->
        <app-validation-field
          [fieldControl]="form.controls.title"
          [validations]="[{ name: 'required', msg: 'Title is required' }]"
        >
          <div
            class="border rounded-lg px-4 py-3"
            [class]="
              form.controls.title.invalid && form.controls.title.touched
                ? 'border-[var(--color-error)] bg-[#fef2f2]'
                : 'border-[#D7E2FF]'
            "
           
          >
            <input
              type="text"
              formControlName="title"
              (blur)="UpdateEpic()"
              class="w-full bg-transparent outline-none text-[20px] leading-[32px] font-[700] text-[var(--color-text-body)]"
            />
          </div>
        </app-validation-field>
        <!-- Description -->
        <div
          class="border border-[#D7E2FF] rounded-lg px-4 py-3 min-h-[100px] mt-15 mb-5"
        >
          <textarea
            formControlName="description"
            (blur)="UpdateEpic()"
            placeholder="No description provided"
            [value]="epic()!.description ?? ''"
            class="w-full min-h-[76px] bg-transparent outline-none resize-none text-[16px] leading-[26px] font-[400] text-[var(--color-neutral-900)] placeholder:italic"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 items-center md:grid-cols-3 gap-4 mb-5">
          <div>
            <p class="text-label-sm text-[#041B3C66] mb-2">Created By</p>
            <div class="flex items-center gap-2">
              <span
                class="w-7 h-7 rounded-[12px] bg-[var(--color-primary-container)] text-white text-xs font-semibold flex items-center justify-center shrink-0"
              >
                {{ initials(epic()!.created_by.name) }}
              </span>
              <span
                class="font-medium text-[var(--color-text-body)] truncate"
                >{{ epic()!.created_by.name }}</span
              >
            </div>
          </div>

          <div>
            <p class="text-label-sm text-[#041B3C66] mb-2">Assignee</p>
            <div class="relative">
              <select
                formControlName="assigneeId"
                (change)="UpdateEpic(); editingAssignee.set(false)"
                (blur)="editingAssignee.set(false)"
                class="w-full appearance-none pr-10 border border-[#D7E2FF] rounded-lg px-3 py-1.5 bg-transparent outline-none font-semibold text-[var(--color-text-body)]"
              >
                <option value="">Unassigned</option>
                @for (option of members(); track option.id) {
                  <option [value]="option.id">
                    {{ option.name }}
                  </option>
                }
              </select>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-[var(--color-neutral-600)] pointer-events-none"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </div>
          </div>

          <!-- Deadline -->
          <div>
            <p class="text-label-sm text-[#041B3C66] mb-2">Deadline</p>
            <input
              type="date"
              formControlName="deadline"
              (change)="UpdateEpic()"
              class="w-full border border-[#D7E2FF] rounded-lg px-3 py-1.5 bg-transparent outline-none font-semibold text-[var(--color-text-body)]"
              [value]="epic()!.deadline"
            />
          </div>

          <!-- Created At -->
          <div class="mb-6">
            <p class="text-label-sm text-[#041B3C66] mb-2">Created At</p>
            <span
              class="flex items-center gap-1.5 font-semibold text-[var(--color-text-body)]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-3.5 h-3.5 text-[var(--color-neutral-600)] shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
                />
              </svg>
              {{ epic()!.created_at | date }}
            </span>
          </div>
        </div>
      </form>

      <!-- Tasks -->
      <div class="flex items-center justify-between mt-1 mb-4">
        <h3 class="text-title-md font-semibold text-[var(--color-text-body)]">
          Tasks
        </h3>
        <button
          type="button"
          class="inline-flex items-center gap-1 text-body-md font-semibold text-[var(--color-primary-container)] hover:text-[var(--color-primary-hover)] cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
          Add Task
        </button>
      </div>

      <!-- Tasks empty state -->
      <div
        class="flex flex-col items-center text-center py-10 px-6 border-[2px] border-dashed border-[#C3C6D64D] rounded-lg bg-[#F1F3FF]"
      >
        <span
          class="w-10 h-10 rounded-lg bg-[#D7E2FF] flex items-center justify-center mb-3"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-[#041B3C4D]"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
            />
          </svg>
        </span>
        <p class="text-body-md text-[var(--color-text-body)] mb-4">
          No tasks have been added to this epic yet
        </p>
        <button type="button" class="btn btn-primary !w-auto gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
          Add Task
        </button>
      </div>
    }
  </div>
</div>
