<div
  class="fixed inset-0 z-50 flex items-end md:items-center justify-center backdrop-blur-[12px] bg-[#041B3C66] md:p-4">
  <button type="button" class="absolute inset-0 w-full h-full cursor-default" aria-label="Close"
    (click)="close()"></button>

  <div
    class="relative w-full md:max-w-[448px] max-h-[92vh] overflow-y-auto bg-[var(--color-surface)] rounded-tl-[32px] rounded-tr-[32px] md:rounded-[8px] shadow-[#041B3C1F] p-6"
    role="dialog" aria-modal="true" aria-labelledby="invite-modal-title">
    <div class="md:hidden mx-auto w-10 h-1.5 rounded-full bg-[var(--color-neutral-200)] mb-5"></div>

    <div class="flex items-start justify-between mb-4">
      <span
        class="md:hidden text-[0.6875rem] font-bold uppercase tracking-[0.08em] text-[var(--color-primary-container)]">
        {{ projectName() || "Project" }}
      </span>

      <span
        class="hidden md:inline-flex items-center justify-center w-[48px] h-[48px] rounded-xl bg-[#F1F3FF] text-[var(--color-primary-container)]">
        <svg class="w-[22px] h-[16px]" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M17 10V7H14V5H17V2H19V5H22V7H19V10H17ZM8 8C6.9 8 5.95833 7.60833 5.175 6.825C4.39167 6.04167 4 5.1 4 4C4 2.9 4.39167 1.95833 5.175 1.175C5.95833 0.391667 6.9 0 8 0C9.1 0 10.0417 0.391667 10.825 1.175C11.6083 1.95833 12 2.9 12 4C12 5.1 11.6083 6.04167 10.825 6.825C10.0417 7.60833 9.1 8 8 8ZM0 16V13.2C0 12.6333 0.145833 12.1125 0.4375 11.6375C0.729167 11.1625 1.11667 10.8 1.6 10.55C2.63333 10.0333 3.68333 9.64583 4.75 9.3875C5.81667 9.12917 6.9 9 8 9C9.1 9 10.1833 9.12917 11.25 9.3875C12.3167 9.64583 13.3667 10.0333 14.4 10.55C14.8833 10.8 15.2708 11.1625 15.5625 11.6375C15.8542 12.1125 16 12.6333 16 13.2V16H0Z"
            fill="#003D9B" />
        </svg>
      </span>

      <button type="button" aria-label="Close"
        class="text-[var(--color-neutral-600)] hover:text-[var(--color-text-body)] cursor-pointer" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <h2 id="invite-modal-title" class="text-2xl font-bold text-[var(--color-text-body)]">
      Invite Team Member
    </h2>
    <p class="mt-1.5 text-[0.85rem] leading-relaxed text-[var(--color-text-secondary)]">
      Send an invitation to join the {{ projectName() || "project" }} workspace.
    </p>

    <form class="mt-5" [formGroup]="form" (ngSubmit)="submit()">
      <app-validation-field [fieldControl]="form.controls.email"
        [label]="{ value: 'Email Address', for: 'invite-email' }" [validations]="[
          { name: 'required', msg: 'Email is required.' },
          { name: 'email', msg: 'Enter a valid email address.' },
          {
            name: 'alreadyMember',
            msg: 'This person is already a member of the project.',
          },
        ]">
        <div class="relative">
          <input id="invite-email" type="email" placeholder="Enter email address" autocomplete="email"
            [formControl]="form.controls.email" [class]="
              form.controls.email.invalid && form.controls.email.touched
                ? 'form-input error pr-10'
                : 'form-input pr-10'
            " />
          <svg
            class="hidden md:block absolute right-3 top-1/2 -translate-y-1/2 text-[var(--color-neutral-600)] pointer-events-none"
            width="15" height="48" viewBox="0 0 15 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M1.5 30C1.0875 30 0.734375 29.8531 0.440625 29.5594C0.146875 29.2656 0 28.9125 0 28.5V19.5C0 19.0875 0.146875 18.7344 0.440625 18.4406C0.734375 18.1469 1.0875 18 1.5 18H13.5C13.9125 18 14.2656 18.1469 14.5594 18.4406C14.8531 18.7344 15 19.0875 15 19.5V28.5C15 28.9125 14.8531 29.2656 14.5594 29.5594C14.2656 29.8531 13.9125 30 13.5 30H1.5ZM7.5 24.75L1.5 21V28.5H13.5V21L7.5 24.75ZM7.5 23.25L13.5 19.5H1.5L7.5 23.25ZM1.5 21V19.5V21V28.5V21Z"
              fill="#737685" />
          </svg>
        </div>
      </app-validation-field>

      <div class="flex flex-col-reverse md:flex-row md:justify-end md:items-center md:gap-20  gap-5 mt-9">
        <button type="button"
          class="w-full md:w-auto py-2 text-center text-[0.9rem] font-semibold text-[var(--color-text-secondary)] hover:text-[var(--color-text-body)] cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="submitting()" (click)="close()">
          Cancel
        </button>

        <button type="submit" class="btn btn-primary md:w-auto" [disabled]="submitting() || form.invalid">
          @if (submitting()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-4 h-4 animate-spin">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25" />
            <path fill="currentColor" class="opacity-75" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4Z" />
          </svg>
          }
          {{ submitting() ? "Sending…" : "Send Invitation" }}
        </button>
      </div>
    </form>
  </div>
</div>
