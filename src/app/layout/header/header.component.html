
<header
  class="flex items-center shrink-0
         h-[60px] px-4 md:px-6
         bg-[var(--color-surface)]
             shadow-[var(--shadow-sm)]
         w-full"
  role="banner"
>

  <button
    type="button"
    (click)="menuToggle.emit()"
    aria-label="Open navigation menu"
    class="flex md:hidden items-center justify-center
           w-9 h-9 rounded-lg mr-3
           text-[var(--color-text-secondary)]
           hover:bg-[var(--color-surface-low)]
           transition-colors duration-150
           focus-visible:outline-2
           focus-visible:outline-[var(--color-primary-container)]"
  >
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
         stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <line x1="2" y1="5"  x2="18" y2="5"  stroke-linecap="round"/>
      <line x1="2" y1="10" x2="18" y2="10" stroke-linecap="round"/>
      <line x1="2" y1="15" x2="18" y2="15" stroke-linecap="round"/>
    </svg>
  </button>

  <span
    class="flex md:hidden font-bold tracking-widest uppercase text-[1rem]
           text-[var(--color-primary)]"
    aria-label="Taskly"
  >
    TASKLY
  </span>

  <div class="flex-1" aria-hidden="true"></div>

  <div class="flex items-center gap-3">
    <div class="hidden md:flex flex-col items-end leading-tight">
      <span class="text-[0.875rem] font-semibold text-[var(--color-text-body)]">
        {{ profile()?.name }}
      </span>
      <span class="text-[0.6rem] font-bold tracking-[0.12em] uppercase
                   text-[var(--color-primary-container)]">
        {{ profile()?.department }}
      </span>
    </div>
    <div
      class="flex items-center justify-center w-9 h-9 rounded-[10px]
             bg-[var(--color-primary-container)] text-white
             text-[0.8rem] font-bold tracking-wide select-none shrink-0"
      role="img"
      [attr.aria-label]="profile()?.name + ' avatar'"
    >
      {{ initials() }}
    </div>

  </div>
</header>
